name: Native platform

on:
  workflow_call:
    inputs:
      label:
        type: string
        required: true
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      os:
        type: string
        required: true
      tier:
        type: string
        required: true
      server_suffix:
        type: string
        required: false
        default: ''
      release_version:
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    if: inputs.tier == 'supported'
    name: Build ${{ inputs.label }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Apply the release version before package installation
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node .github/scripts/release.mjs sync
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: ${{ inputs.target }}-ffmpeg9-bundled-opus
          key: release-no-incremental-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/remedia-core/Cargo.toml', 'packages/remedia-node/Cargo.toml', '.github/native-deps/ffmpeg9.yml', '.github/native-deps/ffmpeg9-windows.yml') }}
      - name: Install Linux build tools
        if: inputs.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev
      - name: Install Linux FFmpeg 9
        if: inputs.os == 'linux'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/native-deps/ffmpeg9.yml
          environment-name: remedia-ffmpeg9
          init-shell: bash
          cache-environment: true
          cache-environment-key: ffmpeg9-${{ inputs.target }}-${{ hashFiles('.github/native-deps/ffmpeg9.yml') }}
          cache-downloads: true
      - name: Install Windows FFmpeg 9 and libclang
        if: inputs.os == 'windows'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/native-deps/ffmpeg9-windows.yml
          environment-name: remedia-ffmpeg9
          init-shell: powershell
          cache-environment: true
          cache-environment-key: ffmpeg9-${{ inputs.target }}-${{ hashFiles('.github/native-deps/ffmpeg9-windows.yml') }}
          cache-downloads: true
      - name: Validate Windows installer syntax
        if: inputs.os == 'windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Set up the MSVC environment
        if: inputs.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Select the MSVC linker explicitly
        if: inputs.os == 'windows'
        shell: pwsh
        run: |
          $linkerDirectory = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64'
          $msvcLinker = Join-Path $linkerDirectory 'link.exe'
          if (!(Test-Path $msvcLinker)) { throw "MSVC linker not found at $msvcLinker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$msvcLinker" >> $env:GITHUB_ENV
          "PATH=$linkerDirectory;$env:PATH" >> $env:GITHUB_ENV
          Write-Host "Using MSVC linker: $msvcLinker"
      - name: Install macOS FFmpeg 9
        if: inputs.os == 'macos'
        run: brew install ffmpeg pkg-config llvm@19
      - name: Configure Linux native library paths
        if: inputs.os == 'linux'
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          echo "FFMPEG_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          libclang_path="$(find /usr/lib/llvm-* -name libclang.so -print -quit)"
          test -n "$libclang_path"
          echo "LIBCLANG_PATH=$(dirname "$libclang_path")" >> "$GITHUB_ENV"
      - name: Configure Windows native library paths
        if: inputs.os == 'windows'
        shell: pwsh
        run: |
          $ffmpegRoot = Join-Path $env:CONDA_PREFIX 'Library'
          $pkgConfigPath = Join-Path $ffmpegRoot 'lib\pkgconfig'
          $libclangPath = Join-Path $env:CONDA_PREFIX 'Library\bin'
          $libclangDll = Join-Path $libclangPath 'libclang.dll'
          if (!(Test-Path -LiteralPath $libclangDll)) {
            $versionedLibclangDll = Get-ChildItem -LiteralPath $libclangPath -Filter 'libclang-*.dll' -File |
              Where-Object { $_.Name -match '^libclang-\d+\.dll$' } |
              Select-Object -First 1
            if (!$versionedLibclangDll) {
              throw "Neither libclang.dll nor a versioned libclang DLL was found in $libclangPath"
            }
            Copy-Item -LiteralPath $versionedLibclangDll.FullName -Destination $libclangDll -ErrorAction Stop
          }
          "FFMPEG_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$pkgConfigPath" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$libclangPath" >> $env:GITHUB_ENV
          "PATH=$libclangPath;$env:PATH" >> $env:GITHUB_ENV
      - name: Configure macOS native library paths
        if: inputs.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg_prefix="$(brew --prefix ffmpeg)"
          llvm_prefix="$(brew --prefix llvm@19)"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$llvm_prefix/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$ffmpeg_prefix/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "$ffmpeg_prefix/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify FFmpeg 9 native dependencies (Linux)
        if: inputs.os == 'linux'
        shell: micromamba-shell {0}
        run: node .github/scripts/verify-native-deps.mjs --build
      - name: Verify FFmpeg 9 native dependencies (macOS)
        if: inputs.os == 'macos'
        run: node .github/scripts/verify-native-deps.mjs --build
      - name: Verify FFmpeg 9 native dependencies (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        run: node .github/scripts/verify-native-deps.mjs --build
      - name: Verify the native Rust target (Linux)
        if: inputs.os == 'linux'
        shell: micromamba-shell {0}
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "Rust host: $host"
          test "$host" = "$RUST_TARGET"
      - name: Verify the native Rust target (macOS)
        if: inputs.os == 'macos'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "Rust host: $host"
          test "$host" = "$RUST_TARGET"
      - name: Verify the native Rust target (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          $rustHost = (rustc -vV | Select-String '^host: ').ToString().Substring(6)
          if ($rustHost -ne $env:RUST_TARGET) { throw "Expected $env:RUST_TARGET but found $rustHost" }
      - name: Run Rust workspace tests in release profile
        if: inputs.os == 'linux'
        shell: micromamba-shell {0}
        run: cargo test --workspace --release --locked
      - name: Run Rust workspace tests in release profile (macOS and Windows)
        if: inputs.os != 'linux'
        run: cargo test --workspace --release --locked
      - name: Build standalone server
        if: inputs.os == 'linux'
        shell: micromamba-shell {0}
        run: cargo build --release --locked -p remedia-server
      - name: Build standalone server (macOS)
        if: inputs.os == 'macos'
        shell: bash
        run: cargo build --release --locked -p remedia-server
      - name: Build standalone server (Windows)
        if: inputs.os == 'windows'
        run: cargo build --release --locked -p remedia-server
      - name: Build N-API addon
        if: inputs.os == 'linux'
        working-directory: packages/remedia-node
        shell: micromamba-shell {0}
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --release --target "$RUST_TARGET"
      - name: Build N-API addon (macOS)
        if: inputs.os == 'macos'
        working-directory: packages/remedia-node
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --release --target "$RUST_TARGET"
      - name: Build N-API addon (Windows)
        if: inputs.os == 'windows'
        working-directory: packages/remedia-node
        shell: pwsh
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --release --target $env:RUST_TARGET
      - name: Stage standalone server binary
        if: inputs.os != 'windows'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
          SERVER_SUFFIX: ${{ inputs.server_suffix }}
        run: |
          mkdir -p "$RUNNER_TEMP/remedia-server"
          cp "target/release/remedia-server$SERVER_SUFFIX" "$RUNNER_TEMP/remedia-server/remedia-server-$RUST_TARGET$SERVER_SUFFIX"
      - name: Stage standalone server binary (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ inputs.target }}
          SERVER_SUFFIX: ${{ inputs.server_suffix }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\remedia-server" | Out-Null
          Copy-Item target\release\remedia-server.exe "$env:RUNNER_TEMP\remedia-server\remedia-server-$env:RUST_TARGET$env:SERVER_SUFFIX"
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ inputs.target }}
          path: |
            packages/remedia-node/node.*.node
            packages/remedia-node/native.js
            packages/remedia-node/native.d.ts
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ inputs.target }}
          path: ${{ runner.temp }}/remedia-server/remedia-server-${{ inputs.target }}${{ inputs.server_suffix }}
          if-no-files-found: error
          retention-days: 7

  test:
    if: inputs.tier == 'supported'
    name: Test ${{ inputs.target }} on Node ${{ matrix.node }}
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24', '26']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Apply the release version before package installation
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node .github/scripts/release.mjs sync
      - name: Install Linux FFmpeg 9 runtime libraries
        if: inputs.os == 'linux'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/native-deps/ffmpeg9.yml
          environment-name: remedia-ffmpeg9
          init-shell: bash
          cache-environment: true
          cache-environment-key: ffmpeg9-${{ inputs.target }}-${{ hashFiles('.github/native-deps/ffmpeg9.yml') }}
          cache-downloads: true
      - name: Install Windows FFmpeg 9 runtime libraries
        if: inputs.os == 'windows'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/native-deps/ffmpeg9-windows-runtime.yml
          environment-name: remedia-ffmpeg9
          init-shell: powershell
          cache-environment: true
          cache-environment-key: ffmpeg9-runtime-${{ inputs.target }}-${{ hashFiles('.github/native-deps/ffmpeg9-windows-runtime.yml') }}
          cache-downloads: true
      - name: Set up the MSVC environment
        if: inputs.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install macOS FFmpeg 9 runtime libraries
        if: inputs.os == 'macos'
        run: brew install ffmpeg pkg-config
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ inputs.target }}
          path: packages/remedia-node
      - uses: actions/download-artifact@v8
        with:
          name: server-${{ inputs.target }}
          path: ${{ runner.temp }}/remedia-server
      - name: Configure Linux native library paths
        if: inputs.os == 'linux'
        shell: micromamba-shell {0}
        run: |
          echo "FFMPEG_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Configure Windows native library paths
        if: inputs.os == 'windows'
        shell: pwsh
        run: |
          $ffmpegRoot = Join-Path $env:CONDA_PREFIX 'Library'
          "FFMPEG_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$(Join-Path $ffmpegRoot 'lib\pkgconfig')" >> $env:GITHUB_ENV
          "PATH=$(Join-Path $ffmpegRoot 'bin');$env:PATH" >> $env:GITHUB_ENV
      - name: Configure macOS native library paths
        if: inputs.os == 'macos'
        shell: bash
        run: |
          ffmpeg_prefix="$(brew --prefix ffmpeg)"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$ffmpeg_prefix/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "$ffmpeg_prefix/bin" >> "$GITHUB_PATH"
      - name: Make the downloaded server executable
        if: inputs.os != 'windows'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
          SERVER_SUFFIX: ${{ inputs.server_suffix }}
        run: chmod +x "$RUNNER_TEMP/remedia-server/remedia-server-$RUST_TARGET$SERVER_SUFFIX"
      - name: Verify installed FFmpeg 9 dependencies (Linux)
        if: inputs.os == 'linux'
        shell: micromamba-shell {0}
        run: node .github/scripts/verify-native-deps.mjs --runtime
      - name: Verify installed FFmpeg 9 dependencies (macOS)
        if: inputs.os == 'macos'
        run: node .github/scripts/verify-native-deps.mjs --runtime
      - name: Verify installed FFmpeg 9 dependencies (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        run: node .github/scripts/verify-native-deps.mjs --runtime
      - name: Verify downloaded native binary architecture and dependencies
        env:
          REMEDIA_SERVER_BINARY: ${{ runner.temp }}/remedia-server/remedia-server-${{ inputs.target }}${{ inputs.server_suffix }}
        run: node .github/scripts/verify-native-artifacts.mjs
      - run: pnpm --filter @remedia/node build:types
      - run: pnpm --filter @remedia/client build
      - run: pnpm --filter @remedia/node test:bindings
      - run: pnpm --filter @remedia/client test
      - run: pnpm --filter @remedia/client test:hybrid
      - name: Run standalone server integration using the downloaded binary
        env:
          REMEDIA_SERVER_BINARY: ${{ runner.temp }}/remedia-server/remedia-server-${{ inputs.target }}${{ inputs.server_suffix }}
        run: pnpm --filter @remedia/client test:server

  cross-build:
    if: inputs.tier == 'cross'
    name: Build ${{ inputs.target }} for npm
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the requested Rust target
        run: |
          rustup show active-toolchain
          rustup target add ${{ inputs.target }}
      - name: Install Linux target build tools
        if: inputs.os == 'linux' || inputs.os == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev llvm pkg-config build-essential git nasm
          if [ "${{ inputs.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
            sudo apt-get install --yes --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
            echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
            # libopus_sys builds bundled Opus with NEON intrinsics. GCC's
            # default ARMv7 hard-float target does not imply a NEON FPU.
            echo "CFLAGS_armv7_unknown_linux_gnueabihf=-mfpu=neon -mfloat-abi=hard" >> "$GITHUB_ENV"
            # build-ffmpeg-cross.sh only sets this on cache misses. Cargo must
            # use the ARM cross-linker even when cached native libraries exist.
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          fi
          libclang_path="$(find /usr/lib/llvm-* -name libclang.so -print -quit)"
          test -n "$libclang_path"
          echo "LIBCLANG_PATH=$(dirname "$libclang_path")" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        if: contains(inputs.target, 'musl')
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild for musl targets
        if: contains(inputs.target, 'musl')
        uses: taiki-e/install-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Set up Android SDK command-line tools
        if: inputs.os == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned Android NDK and set API 24 targets
        if: inputs.os == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk_root/ndk/27.2.12479018"
          test -d "$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          if [ "${{ inputs.target }}" = "aarch64-linux-android" ]; then
            linker="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
            echo "CC_aarch64_linux_android=$linker" >> "$GITHUB_ENV"
          else
            linker="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$linker" >> "$GITHUB_ENV"
            echo "CC_armv7_linux_androideabi=$linker" >> "$GITHUB_ENV"
          fi
          # Bindgen runs on the Linux host. Force the target NDK headers and
          # Clang builtins instead of mixing in host glibc headers.
          ndk_clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          builtin_headers="$("$ndk_clang" -print-resource-dir)/include"
          sysroot="$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          if [ "${{ inputs.target }}" = "aarch64-linux-android" ]; then
            android_target=aarch64-linux-android24
            target_headers=aarch64-linux-android
          else
            android_target=armv7a-linux-androideabi24
            target_headers=arm-linux-androideabi
          fi
          echo "BINDGEN_EXTRA_CLANG_ARGS=--target=$android_target --sysroot=$sysroot -nostdinc -isystem $builtin_headers -isystem $sysroot/usr/include -isystem $sysroot/usr/include/$target_headers" >> "$GITHUB_ENV"
      - name: Install the MSVC target toolchain
        if: inputs.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.target == 'i686-pc-windows-msvc' && 'x86' || 'arm64' }}
      - name: Install Windows build-time libclang
        if: inputs.os == 'windows'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/native-deps/clang-windows.yml
          environment-name: remedia-build-tools
          init-shell: powershell
          cache-environment: true
          cache-environment-key: remedia-clang-${{ inputs.target }}-${{ hashFiles('.github/native-deps/clang-windows.yml') }}
          cache-downloads: true
      - name: Cache target-specific vcpkg FFmpeg 9 libraries (Windows)
        if: inputs.os == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/remedia-vcpkg-installed
          key: vcpkg-ffmpeg9-14439b1-${{ inputs.target }}-${{ hashFiles('.github/native-deps/windows-cross/vcpkg.json') }}
      - name: Install pinned vcpkg and target-specific FFmpeg 9 (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'remedia-vcpkg'
          # vcpkg versioned ports resolve historical Git tree objects, which are
          # unavailable in a depth=1 checkout even when the baseline commit exists.
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg full clone failed' }
          git -C $vcpkgRoot checkout --detach 14439b1e7cdaac4c6f466fee3deede319fcece8f
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg pinned checkout failed' }
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }

          $triplet = if ($env:RUST_TARGET -eq 'i686-pc-windows-msvc') { 'x86-windows' } else { 'arm64-windows' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'remedia-vcpkg-installed'
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE '.github\native-deps\windows-cross'
          $env:VCPKG_ROOT = $vcpkgRoot
          $env:VCPKG_DEFAULT_TRIPLET = $triplet
          Push-Location $manifestRoot
          try {
            & (Join-Path $vcpkgRoot 'vcpkg.exe') install --triplet $triplet --x-install-root=$installRoot
            if ($LASTEXITCODE -ne 0) { throw "vcpkg FFmpeg install failed for $triplet" }
          } finally {
            Pop-Location
          }
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_INSTALL_ROOT=$installRoot" >> $env:GITHUB_ENV
          "VCPKG_TARGET_TRIPLET=$triplet" >> $env:GITHUB_ENV
          # Git for Windows also provides a link.exe (GNU coreutils). Pin
          # Cargo's linker to MSVC instead of relying on PATH resolution.
          $msvcTarget = if ($triplet -eq 'x86-windows') { 'x86' } else { 'arm64' }
          $msvcLinker = Join-Path $env:VCToolsInstallDir "bin\\Hostx64\\$msvcTarget\\link.exe"
          if (!(Test-Path -LiteralPath $msvcLinker)) { throw "MSVC linker not found: $msvcLinker" }
          $rustTriple = if ($triplet -eq 'x86-windows') { 'I686_PC_WINDOWS_MSVC' } else { 'AARCH64_PC_WINDOWS_MSVC' }
          "CARGO_TARGET_${rustTriple}_LINKER=$msvcLinker" >> $env:GITHUB_ENV
      - name: Configure Windows target FFmpeg and host libclang paths
        if: inputs.os == 'windows'
        shell: pwsh
        run: |
          $ffmpegRoot = Join-Path $env:VCPKG_INSTALL_ROOT $env:VCPKG_TARGET_TRIPLET
          $pkgConfigPath = Join-Path $ffmpegRoot 'lib\pkgconfig'
          $libclangPath = Join-Path $env:CONDA_PREFIX 'Library\bin'
          $libclangDll = Join-Path $libclangPath 'libclang.dll'
          if (!(Test-Path -LiteralPath $libclangDll)) {
            $versionedDll = Get-ChildItem -LiteralPath $libclangPath -Filter 'libclang-*.dll' -File |
              Where-Object { $_.Name -match '^libclang-\d+\.dll$' } |
              Select-Object -First 1
            if (!$versionedDll) { throw "No libclang DLL found in $libclangPath" }
            Copy-Item -LiteralPath $versionedDll.FullName -Destination $libclangDll -ErrorAction Stop
          }
          if (!(Test-Path (Join-Path $ffmpegRoot 'include\libavcodec\avcodec.h'))) {
            throw "Target FFmpeg headers are missing from $ffmpegRoot"
          }
          "FFMPEG_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$pkgConfigPath" >> $env:GITHUB_ENV
          "PKG_CONFIG_LIBDIR=$pkgConfigPath" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$libclangPath" >> $env:GITHUB_ENV
          "PATH=$(Join-Path $ffmpegRoot 'bin');$libclangPath;$env:PATH" >> $env:GITHUB_ENV
      - name: Install pnpm for cross-target build probes
        if: inputs.os != 'freebsd'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - name: Set up Node.js for cross-target build probes
        if: inputs.os != 'freebsd'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply the release version before package installation
        if: inputs.os != 'freebsd' && inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node .github/scripts/release.mjs sync
      - name: Install workspace dependencies for the target build probe
        if: inputs.os != 'freebsd'
        run: pnpm install --frozen-lockfile
      - name: Cache target-specific FFmpeg 9 libraries (Linux and Android)
        if: inputs.os == 'linux' || inputs.os == 'android'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/remedia-ffmpeg-${{ inputs.target }}
          key: ffmpeg9-cross-${{ inputs.target }}-${{ hashFiles('.github/scripts/build-ffmpeg-cross.sh') }}-946fcce
      - name: Build target-specific FFmpeg 9 libraries (Linux and Android)
        if: inputs.os == 'linux' || inputs.os == 'android'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: bash .github/scripts/build-ffmpeg-cross.sh
      - name: Verify target FFmpeg 9 development libraries (Linux and Android)
        if: inputs.os == 'linux' || inputs.os == 'android'
        shell: bash
        run: node .github/scripts/verify-native-deps.mjs --build
      - name: Patch ffmpeg-sys-next 9.0.1 Vulkan bindgen shim for 32-bit targets
        if: inputs.target == 'armv7-unknown-linux-gnueabihf' || inputs.target == 'armv7-linux-androideabi' || inputs.target == 'i686-pc-windows-msvc'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          cargo fetch --locked --target "$RUST_TARGET"
          cargo metadata --locked --format-version=1 --filter-platform "$RUST_TARGET" > /dev/null
          node .github/scripts/patch-ffmpeg-sys-vulkan.mjs
      - name: Build Linux N-API addon for distribution
        if: inputs.os == 'linux'
        working-directory: packages/remedia-node
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          case "$RUST_TARGET" in
            *-musl) pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --release --target "$RUST_TARGET" --cross-compile ;;
            *) pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --release --target "$RUST_TARGET" ;;
          esac
      - name: Build Android N-API addon for distribution
        if: inputs.os == 'android'
        working-directory: packages/remedia-node
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --release --target "$RUST_TARGET"
      - name: Verify target FFmpeg 9 development libraries (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        run: node .github/scripts/verify-native-deps.mjs --build
      - name: Build Windows N-API addon for distribution
        if: inputs.os == 'windows'
        working-directory: packages/remedia-node
        shell: pwsh
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --release --target $env:RUST_TARGET
      - name: Upload cross-built native bindings for npm
        if: inputs.os != 'freebsd'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ inputs.target }}
          path: packages/remedia-node/node.*.node
          if-no-files-found: error
          retention-days: 7
      - name: Start FreeBSD 15.1 native VM
        if: inputs.os == 'freebsd'
        uses: cross-platform-actions/action@v1.7.0
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        with:
          operating_system: freebsd
          version: '15.1'
          memory: 8G
          cpu_count: 3
          environment_variables: RELEASE_VERSION
          shell: bash
      - name: Build and runtime-test FreeBSD native artifacts
        if: inputs.os == 'freebsd'
        shell: cpa.sh {0}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          sudo pkg update -f
          sudo pkg install -y curl git node24 npm-node24 cmake pkgconf llvm19 gmake nasm
          # The FreeBSD 15 package repositories do not contain the ffmpeg9
          # package. Compile the same pinned FFmpeg 9.0.2 revision used by the
          # cross-platform jobs instead of installing an unrelated FFmpeg major.
          ffmpeg_source="$HOME/remedia-ffmpeg-9"
          git init -q "$ffmpeg_source"
          git -C "$ffmpeg_source" remote add origin https://github.com/FFmpeg/FFmpeg.git
          git -C "$ffmpeg_source" fetch --quiet --depth=1 origin 946fcce07b6dcd0331c8cc609192aeff5e1924f8
          git -C "$ffmpeg_source" checkout --quiet --detach FETCH_HEAD
          (
            cd "$ffmpeg_source"
            ./configure --cc=cc --host-cc=cc --prefix=/usr/local --enable-shared --disable-static --disable-programs --disable-doc --disable-debug --disable-autodetect --enable-network --enable-pic
            gmake -j3
            sudo gmake install
          )
          # FreeBSD places upstream pkg-config files under lib/pkgconfig;
          # initialize the search path before verifying the new installation.
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/libdata/pkgconfig
          test "$(pkg-config --modversion libavcodec | cut -d. -f1)" = 63
          test "$(pkg-config --modversion libavformat | cut -d. -f1)" = 63
          test "$(pkg-config --modversion libavutil | cut -d. -f1)" = 61
          test "$(pkg-config --modversion libavfilter | cut -d. -f1)" = 12
          test "$(pkg-config --modversion libswresample | cut -d. -f1)" = 7
          curl https://sh.rustup.rs -sSf --output rustup.sh
          sh rustup.sh -y --profile minimal --default-toolchain 1.99.1
          source "$HOME/.cargo/env"
          sudo npm install --global pnpm@12.16.1 --ignore-scripts
          export FFMPEG_DIR=/usr/local
          export PKG_CONFIG_PATH=/usr/local/libdata/pkgconfig:/usr/local/lib/pkgconfig
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
          export LIBCLANG_PATH="$(dirname "$(find /usr/local -name libclang.so -print -quit)")"
          if [ -n "$RELEASE_VERSION" ]; then
            node .github/scripts/release.mjs sync "$RELEASE_VERSION"
          fi
          pnpm install --frozen-lockfile
          cargo test --workspace --release --locked
          cargo build --release --locked -p remedia-server
          pnpm --filter @remedia/node exec napi build --platform --esm --js native.js --dts native.d.ts --release --target x86_64-unknown-freebsd
          pnpm --filter @remedia/node build:types
          pnpm --filter @remedia/client build
          pnpm --filter @remedia/node test:bindings
          pnpm --filter @remedia/client test
          pnpm --filter @remedia/client test:hybrid
          REMEDIA_SERVER_BINARY="$PWD/target/release/remedia-server" pnpm --filter @remedia/client test:server
      - name: Upload runtime-tested FreeBSD N-API release binding
        if: inputs.os == 'freebsd'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ inputs.target }}
          path: packages/remedia-node/node.freebsd-x64.node
          if-no-files-found: error
          retention-days: 7
