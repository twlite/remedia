name: Native platform

on:
  workflow_call:
    inputs:
      label:
        type: string
        required: true
      target:
        type: string
        required: true
      runner:
        type: string
        required: true
      os:
        type: string
        required: true
      tier:
        type: string
        required: true
      server_suffix:
        type: string
        required: false
        default: ''
      release_version:
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  REMEDIA_BUILD_VERSION: ${{ inputs.release_version }}
  REMEDIA_BUILD_COMMIT: ${{ github.sha }}

jobs:
  build:
    if: inputs.tier == 'supported'
    name: Build ${{ inputs.label }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Apply the release version before package installation
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node .github/scripts/release.mjs sync
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Install Linux build tools
        if: inputs.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev pkg-config nasm

      - name: Validate Windows installer syntax
        if: inputs.os == 'windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Set up the MSVC environment
        if: inputs.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}
      - name: Install macOS build tools
        if: inputs.os == 'macos'
        run: brew install pkg-config nasm llvm@19

      - name: Install Windows build-time libclang
        if: inputs.os == 'windows'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{ inputs.target == 'aarch64-pc-windows-msvc' && '.github/native-deps/clang-windows-arm64.yml' || '.github/native-deps/clang-windows.yml' }}
          environment-name: remedia-build-tools
          init-shell: powershell
          cache-environment: true
          cache-environment-key: remedia-clang-${{ inputs.target }}-${{ hashFiles('.github/native-deps/clang-windows*.yml') }}
          cache-downloads: true
      - name: Install pinned native ARM64 libclang
        if: inputs.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: ./.github/scripts/install-windows-arm64-llvm.ps1
      - name: Fingerprint native dependency inputs
        id: native-key
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: node .github/scripts/native-cache-key.mjs
      - uses: actions/cache/restore@v5
        id: native-cache
        with:
          path: |
            ${{ runner.temp }}/remedia-static/install
            ${{ runner.temp }}/remedia-ffmpeg-${{ inputs.target }}
            ${{ runner.temp }}/remedia-vcpkg/installed
          key: ${{ steps.native-key.outputs.key }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: native-${{ steps.native-key.outputs.key }}-${{ hashFiles('.github/scripts/patch-ffmpeg-sys-vulkan.mjs') }}
          shared-key: ${{ inputs.target }}-static-v2
          cache-on-failure: true
      - name: Install pinned vcpkg and target-specific FFmpeg 9 (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: ./.github/scripts/build-ffmpeg-windows.ps1
      - name: Configure Windows target FFmpeg and host libclang paths
        if: inputs.os == 'windows'
        shell: pwsh
        run: |
          $ffmpegRoot = Join-Path $env:VCPKG_INSTALL_ROOT $env:VCPKG_TARGET_TRIPLET
          $pkgConfigPath = Join-Path $ffmpegRoot 'lib\pkgconfig'
          $libclangPath = if ($env:REMEDIA_BUILD_LIBCLANG) { $env:REMEDIA_BUILD_LIBCLANG } else { Join-Path $env:CONDA_PREFIX 'Library\bin' }
          $libclangDll = Join-Path $libclangPath 'libclang.dll'
          if (!(Test-Path -LiteralPath $libclangDll)) {
            $versionedDll = Get-ChildItem -LiteralPath $libclangPath -Filter 'libclang-*.dll' -File |
              Where-Object { $_.Name -match '^libclang-\d+\.dll$' } |
              Select-Object -First 1
            if (!$versionedDll) { throw "No libclang DLL found in $libclangPath" }
            Copy-Item -LiteralPath $versionedDll.FullName -Destination $libclangDll -ErrorAction Stop
          }
          if (!(Test-Path (Join-Path $ffmpegRoot 'include\libavcodec\avcodec.h'))) {
            throw "Target FFmpeg headers are missing from $ffmpegRoot"
          }
          "REMEDIA_STATIC_FFMPEG_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$pkgConfigPath" >> $env:GITHUB_ENV
          "PKG_CONFIG_LIBDIR=$pkgConfigPath" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$libclangPath" >> $env:GITHUB_ENV
          "PATH=$(Join-Path $ffmpegRoot 'bin');$libclangPath;$env:PATH" >> $env:GITHUB_ENV
      - name: Build pinned static FFmpeg (POSIX)
        env:
          RUST_TARGET: ${{ inputs.target }}
        if: inputs.os != 'windows'
        shell: bash
        run: |
          if [ "${{ inputs.os }}" = macos ]; then
            echo "LIBCLANG_PATH=$(brew --prefix llvm@19)/lib" >> "$GITHUB_ENV"
          else
            echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib/llvm-* -name libclang.so -print -quit)")" >> "$GITHUB_ENV"
          fi
          bash .github/scripts/build-ffmpeg-static.sh
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify FFmpeg 9 native dependencies (Linux)
        if: inputs.os == 'linux'
        shell: bash
        run: node .github/scripts/verify-native-deps.mjs --build
      - name: Verify FFmpeg 9 native dependencies (macOS)
        if: inputs.os == 'macos'
        run: node .github/scripts/verify-native-deps.mjs --build
      - name: Verify FFmpeg 9 native dependencies (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        run: node .github/scripts/verify-native-deps.mjs --build
      - uses: actions/cache/save@v5
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/remedia-static/install
            ${{ runner.temp }}/remedia-ffmpeg-${{ inputs.target }}
            ${{ runner.temp }}/remedia-vcpkg/installed
          key: ${{ steps.native-key.outputs.key }}
      - name: Verify the native Rust target (Linux)
        if: inputs.os == 'linux'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "Rust host: $host"
          test "$host" = "$RUST_TARGET"
      - name: Verify the native Rust target (macOS)
        if: inputs.os == 'macos'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "Rust host: $host"
          test "$host" = "$RUST_TARGET"
      - name: Verify the native Rust target (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          $rustHost = (rustc -vV | Select-String '^host: ').ToString().Substring(6)
          if ($rustHost -ne $env:RUST_TARGET) { throw "Expected $env:RUST_TARGET but found $rustHost" }
      - name: Run Rust workspace tests
        run: cargo test --workspace --locked
      - name: Build standalone server
        run: cargo build --profile ${{ inputs.release_version != '' && 'release' || 'ci' }} --locked -p remedia-server --bins --target ${{ inputs.target }}
      - name: Test installed native CLI paths and self-updates
        env:
          REMEDIA_TEST_CLI: ${{ github.workspace }}/target/${{ inputs.target }}/${{ inputs.release_version != '' && 'release' || 'ci' }}/remedia-server${{ inputs.server_suffix }}
          REMEDIA_TEST_RUNTIME: ${{ github.workspace }}/target/${{ inputs.target }}/${{ inputs.release_version != '' && 'release' || 'ci' }}/remedia-server-runtime${{ inputs.server_suffix }}
        run: node --test .github/scripts/installer.test.mjs
      - name: Build N-API addon
        working-directory: packages/remedia-node
        run: pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --profile ${{ inputs.release_version != '' && 'release' || 'ci' }} --target ${{ inputs.target }}
      - name: Audit static macOS linkage
        if: inputs.os == 'macos'
        run: node .github/scripts/audit-static-ffmpeg.mjs packages/remedia-node/node.*.node
      - name: Stage standalone server binary
        if: inputs.os != 'windows'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
          SERVER_SUFFIX: ${{ inputs.server_suffix }}
        run: |
          mkdir -p "$RUNNER_TEMP/remedia-server"
          cp "target/${{ inputs.target }}/${{ inputs.release_version != '' && 'release' || 'ci' }}/remedia-server$SERVER_SUFFIX" "$RUNNER_TEMP/remedia-server/remedia-server-$RUST_TARGET$SERVER_SUFFIX"
          cp "target/${{ inputs.target }}/${{ inputs.release_version != '' && 'release' || 'ci' }}/remedia-server-runtime$SERVER_SUFFIX" "$RUNNER_TEMP/remedia-server/remedia-server-runtime-$RUST_TARGET$SERVER_SUFFIX"
      - name: Stage standalone server binary (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ inputs.target }}
          SERVER_SUFFIX: ${{ inputs.server_suffix }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\remedia-server" | Out-Null
          Copy-Item target\${{ inputs.target }}\${{ inputs.release_version != '' && 'release' || 'ci' }}\remedia-server.exe "$env:RUNNER_TEMP\remedia-server\remedia-server-$env:RUST_TARGET$env:SERVER_SUFFIX"
          Copy-Item target\${{ inputs.target }}\${{ inputs.release_version != '' && 'release' || 'ci' }}\remedia-server-runtime.exe "$env:RUNNER_TEMP\remedia-server\remedia-server-runtime-$env:RUST_TARGET$env:SERVER_SUFFIX"
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ inputs.target }}
          path: |
            packages/remedia-node/node.*.node
            packages/remedia-node/native.js
            packages/remedia-node/native.d.ts
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ inputs.target }}
          path: |
            ${{ runner.temp }}/remedia-server/remedia-server-${{ inputs.target }}${{ inputs.server_suffix }}
            ${{ runner.temp }}/remedia-server/remedia-server-runtime-${{ inputs.target }}${{ inputs.server_suffix }}
          if-no-files-found: error
          retention-days: 7
      - name: Capture corresponding native dependency source
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: bash .github/scripts/capture-native-source.sh
      - uses: actions/upload-artifact@v7
        with:
          name: native-source-${{ inputs.target }}
          path: ${{ runner.temp }}/native-source-${{ inputs.target }}.tar.gz
          if-no-files-found: error

  test:
    if: inputs.tier == 'supported'
    name: Test ${{ inputs.target }} on Node ${{ matrix.node }}
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.release_version != '' && '["22.18.0", "24", "26"]' || '["24"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Apply the release version before package installation
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node .github/scripts/release.mjs sync

      - name: Set up the MSVC environment
        if: inputs.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ inputs.target }}
          path: packages/remedia-node
      - uses: actions/download-artifact@v8
        with:
          name: server-${{ inputs.target }}
          path: ${{ runner.temp }}/remedia-server

      - name: Make the downloaded server executable
        if: inputs.os != 'windows'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
          SERVER_SUFFIX: ${{ inputs.server_suffix }}
        run: |
          chmod +x "$RUNNER_TEMP/remedia-server/remedia-server-$RUST_TARGET$SERVER_SUFFIX"
          chmod +x "$RUNNER_TEMP/remedia-server/remedia-server-runtime-$RUST_TARGET$SERVER_SUFFIX"

      - name: Verify downloaded native binary architecture and dependencies
        env:
          REMEDIA_SERVER_BINARY: ${{ runner.temp }}/remedia-server/remedia-server-${{ inputs.target }}${{ inputs.server_suffix }}
        run: node .github/scripts/verify-native-artifacts.mjs
      - run: pnpm --filter @remedia/node build:types
      - run: pnpm --filter @remedia/client build
      - name: Test clean npm installation with ESM and CommonJS consumers
        run: node .github/scripts/smoke-packed-package.mjs ${{ inputs.target }}
      - run: pnpm --filter @remedia/node test:bindings
      - run: pnpm --filter @remedia/client test
      - run: pnpm --filter @remedia/client test:hybrid
      - name: Run standalone server integration using the downloaded binary
        env:
          REMEDIA_SERVER_BINARY: ${{ runner.temp }}/remedia-server/remedia-server-${{ inputs.target }}${{ inputs.server_suffix }}
        run: pnpm --filter @remedia/client test:server

  cross-build:
    if: inputs.tier == 'cross'
    name: Build ${{ inputs.target }} for npm
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the requested Rust target
        run: |
          rustup show active-toolchain
          rustup target add ${{ inputs.target }}
      - name: Install Linux target build tools
        if: inputs.os == 'linux' || inputs.os == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev llvm pkg-config build-essential git nasm
          if [ "${{ inputs.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
            sudo apt-get install --yes --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
            echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
            # libopus_sys builds bundled Opus with NEON intrinsics. GCC's
            # default ARMv7 hard-float target does not imply a NEON FPU.
            echo "CFLAGS_armv7_unknown_linux_gnueabihf=-mfpu=neon -mfloat-abi=hard" >> "$GITHUB_ENV"
            # build-ffmpeg-cross.sh only sets this on cache misses. Cargo must
            # use the ARM cross-linker even when cached native libraries exist.
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> "$GITHUB_ENV"
          fi
          libclang_path="$(find /usr/lib/llvm-* -name libclang.so -print -quit)"
          test -n "$libclang_path"
          echo "LIBCLANG_PATH=$(dirname "$libclang_path")" >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@v2
        if: contains(inputs.target, 'musl')
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild for musl targets
        if: contains(inputs.target, 'musl')
        uses: taiki-e/install-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild@0.24.1
      - name: Set up Android SDK command-line tools
        if: inputs.os == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned Android NDK and set API 24 targets
        if: inputs.os == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk_root/ndk/27.2.12479018"
          test -d "$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          if [ "${{ inputs.target }}" = "aarch64-linux-android" ]; then
            linker="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
            echo "CC_aarch64_linux_android=$linker" >> "$GITHUB_ENV"
          else
            linker="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$linker" >> "$GITHUB_ENV"
            echo "CC_armv7_linux_androideabi=$linker" >> "$GITHUB_ENV"
          fi
          # Bindgen runs on the Linux host. Force the target NDK headers and
          # Clang builtins instead of mixing in host glibc headers.
          ndk_clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          builtin_headers="$("$ndk_clang" -print-resource-dir)/include"
          sysroot="$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          if [ "${{ inputs.target }}" = "aarch64-linux-android" ]; then
            android_target=aarch64-linux-android24
            target_headers=aarch64-linux-android
          else
            android_target=armv7a-linux-androideabi24
            target_headers=arm-linux-androideabi
          fi
          echo "BINDGEN_EXTRA_CLANG_ARGS=--target=$android_target --sysroot=$sysroot -nostdinc -isystem $builtin_headers -isystem $sysroot/usr/include -isystem $sysroot/usr/include/$target_headers" >> "$GITHUB_ENV"
      - name: Install the MSVC target toolchain
        if: inputs.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.target == 'i686-pc-windows-msvc' && 'x86' || inputs.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}
      - name: Install Windows build-time libclang
        if: inputs.os == 'windows'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{ inputs.target == 'aarch64-pc-windows-msvc' && '.github/native-deps/clang-windows-arm64.yml' || '.github/native-deps/clang-windows.yml' }}
          environment-name: remedia-build-tools
          init-shell: powershell
          cache-environment: true
          cache-environment-key: remedia-clang-${{ inputs.target }}-${{ hashFiles('.github/native-deps/clang-windows*.yml') }}
          cache-downloads: true
      - name: Install pinned native ARM64 libclang
        if: inputs.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: ./.github/scripts/install-windows-arm64-llvm.ps1
      - name: Fingerprint native dependency inputs
        if: inputs.os != 'freebsd'
        id: native-key
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: node .github/scripts/native-cache-key.mjs
      - uses: actions/cache/restore@v5
        id: native-cache
        if: inputs.os != 'freebsd'
        with:
          path: |
            ${{ runner.temp }}/remedia-static/install
            ${{ runner.temp }}/remedia-ffmpeg-${{ inputs.target }}
            ${{ runner.temp }}/remedia-vcpkg/installed
          key: ${{ steps.native-key.outputs.key }}
      - uses: Swatinem/rust-cache@v2.9.3
        if: inputs.os != 'freebsd'
        with:
          key: native-${{ steps.native-key.outputs.key }}-${{ hashFiles('.github/scripts/patch-ffmpeg-sys-vulkan.mjs') }}
          shared-key: ${{ inputs.target }}-static-v2
          cache-on-failure: true
      - name: Install pinned vcpkg and target-specific FFmpeg 9 (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: ./.github/scripts/build-ffmpeg-windows.ps1
      - name: Configure Windows target FFmpeg and host libclang paths
        if: inputs.os == 'windows'
        shell: pwsh
        run: |
          $ffmpegRoot = Join-Path $env:VCPKG_INSTALL_ROOT $env:VCPKG_TARGET_TRIPLET
          $pkgConfigPath = Join-Path $ffmpegRoot 'lib\pkgconfig'
          $libclangPath = if ($env:REMEDIA_BUILD_LIBCLANG) { $env:REMEDIA_BUILD_LIBCLANG } else { Join-Path $env:CONDA_PREFIX 'Library\bin' }
          $libclangDll = Join-Path $libclangPath 'libclang.dll'
          if (!(Test-Path -LiteralPath $libclangDll)) {
            $versionedDll = Get-ChildItem -LiteralPath $libclangPath -Filter 'libclang-*.dll' -File |
              Where-Object { $_.Name -match '^libclang-\d+\.dll$' } |
              Select-Object -First 1
            if (!$versionedDll) { throw "No libclang DLL found in $libclangPath" }
            Copy-Item -LiteralPath $versionedDll.FullName -Destination $libclangDll -ErrorAction Stop
          }
          if (!(Test-Path (Join-Path $ffmpegRoot 'include\libavcodec\avcodec.h'))) {
            throw "Target FFmpeg headers are missing from $ffmpegRoot"
          }
          "REMEDIA_STATIC_FFMPEG_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$pkgConfigPath" >> $env:GITHUB_ENV
          "PKG_CONFIG_LIBDIR=$pkgConfigPath" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$libclangPath" >> $env:GITHUB_ENV
          "PATH=$(Join-Path $ffmpegRoot 'bin');$libclangPath;$env:PATH" >> $env:GITHUB_ENV
      - name: Install pnpm for cross-target build probes
        if: inputs.os != 'freebsd'
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - name: Set up Node.js for cross-target build probes
        if: inputs.os != 'freebsd'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply the release version before package installation
        if: inputs.os != 'freebsd' && inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node .github/scripts/release.mjs sync
      - name: Install workspace dependencies for the target build probe
        if: inputs.os != 'freebsd'
        run: pnpm install --frozen-lockfile
      - name: Build target-specific FFmpeg 9 libraries (Linux and Android)
        if: inputs.os == 'linux' || inputs.os == 'android'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: bash .github/scripts/build-ffmpeg-cross.sh
      - name: Verify target FFmpeg 9 development libraries
        if: inputs.os != 'freebsd'
        run: node .github/scripts/verify-native-deps.mjs --build
      - uses: actions/cache/save@v5
        if: inputs.os != 'freebsd' && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/remedia-static/install
            ${{ runner.temp }}/remedia-ffmpeg-${{ inputs.target }}
            ${{ runner.temp }}/remedia-vcpkg/installed
          key: ${{ steps.native-key.outputs.key }}
      - name: Patch ffmpeg-sys-next 9.0.1 Vulkan bindgen shim for 32-bit targets
        if: inputs.target == 'armv7-unknown-linux-gnueabihf' || inputs.target == 'armv7-linux-androideabi' || inputs.target == 'i686-pc-windows-msvc'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          cargo fetch --locked --target "$RUST_TARGET"
          cargo metadata --locked --format-version=1 --filter-platform "$RUST_TARGET" > /dev/null
          node .github/scripts/patch-ffmpeg-sys-vulkan.mjs
      - name: Build Linux N-API addon for distribution
        if: inputs.os == 'linux'
        working-directory: packages/remedia-node
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          case "$RUST_TARGET" in
            *-musl) pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --profile ${{ inputs.release_version != '' && 'release' || 'ci' }} --target "$RUST_TARGET" --cross-compile ;;
            *) pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --profile ${{ inputs.release_version != '' && 'release' || 'ci' }} --target "$RUST_TARGET" ;;
          esac
      - name: Build Android N-API addon for distribution
        if: inputs.os == 'android'
        working-directory: packages/remedia-node
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --profile ${{ inputs.release_version != '' && 'release' || 'ci' }} --target "$RUST_TARGET"
      - name: Build Windows N-API addon for distribution
        if: inputs.os == 'windows'
        working-directory: packages/remedia-node
        shell: pwsh
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --profile ${{ inputs.release_version != '' && 'release' || 'ci' }} --target $env:RUST_TARGET
      - name: Build additional standalone Linux servers
        if: contains(inputs.target, 'musl')
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          case "$RUST_TARGET" in
            *-musl) cargo zigbuild --profile ${{ inputs.release_version != '' && 'release' || 'ci' }} --locked -p remedia-server --bins --target "$RUST_TARGET" ;;
            *) cargo build --profile ${{ inputs.release_version != '' && 'release' || 'ci' }} --locked -p remedia-server --bins --target "$RUST_TARGET" ;;
          esac
          mkdir -p "$RUNNER_TEMP/additional-servers"
          for name in remedia-server remedia-server-runtime; do
            cp "target/$RUST_TARGET/${{ inputs.release_version != '' && 'release' || 'ci' }}/$name" "$RUNNER_TEMP/additional-servers/$name-$RUST_TARGET"
          done
      - name: Verify musl server startup in a clean Alpine container
        if: contains(inputs.target, 'musl')
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: |
          docker run --rm -v "$RUNNER_TEMP/additional-servers:/artifacts:ro" alpine:3.22 sh -ec '
            /artifacts/remedia-server-'"$RUST_TARGET"' --version
            /artifacts/remedia-server-runtime-'"$RUST_TARGET"' --library-versions
          '
      - name: Load musl addon and decode in a clean Node container
        if: contains(inputs.target, 'musl')
        shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -w /workspace node:24.11.1-alpine3.22 sh -ec '
            node .github/scripts/smoke-static-addon.mjs packages/remedia-node/node.*.node
          '
      - uses: actions/upload-artifact@v7
        if: contains(inputs.target, 'musl')
        with:
          name: server-${{ inputs.target }}
          path: ${{ runner.temp }}/additional-servers/*
          if-no-files-found: error
      - name: Capture corresponding native dependency source
        if: inputs.os != 'freebsd'
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.target }}
        run: bash .github/scripts/capture-native-source.sh
      - uses: actions/upload-artifact@v7
        if: inputs.os != 'freebsd'
        with:
          name: native-source-${{ inputs.target }}
          path: ${{ runner.temp }}/native-source-${{ inputs.target }}.tar.gz
          if-no-files-found: error
      - name: Audit cross-built native dependencies
        if: inputs.os != 'freebsd'
        shell: bash
        run: node .github/scripts/audit-static-ffmpeg.mjs packages/remedia-node/node.*.node
      - name: Upload cross-built native bindings for npm
        if: inputs.os != 'freebsd'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ inputs.target }}
          path: |
            packages/remedia-node/node.*.node
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache@v5
        if: inputs.os == 'freebsd'
        with:
          path: .ci-freebsd-native/remedia-static/install
          key: freebsd-15.1-native-v2-${{ hashFiles('.github/scripts/build-ffmpeg*', '.github/scripts/native-cache-key.mjs', '.github/scripts/source-checkout.mjs', '.github/native-deps/**', 'rust-toolchain.toml') }}
      - name: Start FreeBSD 15.1 native VM
        if: inputs.os == 'freebsd'
        uses: cross-platform-actions/action@v1.7.0
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        with:
          operating_system: freebsd
          version: '15.1'
          memory: 8G
          cpu_count: 3
          environment_variables: RELEASE_VERSION
          shell: bash
      - name: Build and runtime-test FreeBSD native artifacts
        if: inputs.os == 'freebsd'
        shell: cpa.sh {0}
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          sudo pkg update -f
          sudo pkg install -y curl git node24 npm-node24 cmake pkgconf llvm19 gmake nasm python3
          sudo pkg clean -ay
          # The VM disk is small; debug assertions stay enabled without large DWARF files.
          export CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0
          export RUNNER_TEMP="$PWD/.ci-freebsd-native"
          export GITHUB_ENV="$RUNNER_TEMP/environment"
          mkdir -p "$RUNNER_TEMP"
          MAKE=gmake bash .github/scripts/build-ffmpeg-static.sh
          export PKG_CONFIG_PATH="$RUNNER_TEMP/remedia-static/install/lib/pkgconfig"
          curl https://sh.rustup.rs -sSf --output rustup.sh
          sh rustup.sh -y --profile minimal --default-toolchain 1.99.1
          source "$HOME/.cargo/env"
          sudo npm install --global pnpm@12.16.1 --ignore-scripts
          export REMEDIA_STATIC_FFMPEG_DIR="$RUNNER_TEMP/remedia-static/install"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/remedia-static/install/lib/pkgconfig"
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
          export LIBCLANG_PATH="$(dirname "$(find /usr/local -name libclang.so -print -quit)")"
          if [ -n "$RELEASE_VERSION" ]; then
            node .github/scripts/release.mjs sync "$RELEASE_VERSION"
          fi
          pnpm install --frozen-lockfile
          df -h .
          cargo test --workspace --locked
          # Tests use target/debug; distributed artifacts use a separate ci/release profile.
          cargo clean --profile test
          df -h .
          cargo build --profile ${{ inputs.release_version != '' && 'release' || 'ci' }} --locked -p remedia-server --bins --target ${{ inputs.target }}
          pnpm --filter @remedia/node exec napi build --platform --esm --js native.js --dts native.d.ts --profile ${{ inputs.release_version != '' && 'release' || 'ci' }} --target x86_64-unknown-freebsd
          node .github/scripts/audit-static-ffmpeg.mjs packages/remedia-node/node.freebsd-x64.node target/${{ inputs.target }}/${{ inputs.release_version != '' && 'release' || 'ci' }}/remedia-server target/${{ inputs.target }}/${{ inputs.release_version != '' && 'release' || 'ci' }}/remedia-server-runtime
          pnpm --filter @remedia/node build:types
          pnpm --filter @remedia/client build
          pnpm --filter @remedia/node test:bindings
          pnpm --filter @remedia/client test
          pnpm --filter @remedia/client test:hybrid
          REMEDIA_SERVER_BINARY="$PWD/target/${{ inputs.target }}/${{ inputs.release_version != '' && 'release' || 'ci' }}/remedia-server" pnpm --filter @remedia/client test:server
          RUST_TARGET=x86_64-unknown-freebsd bash .github/scripts/capture-native-source.sh
          cp "$RUNNER_TEMP/native-source-x86_64-unknown-freebsd.tar.gz" .
      - name: Upload runtime-tested FreeBSD N-API release binding
        if: inputs.os == 'freebsd'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ inputs.target }}
          path: |
            packages/remedia-node/node.freebsd-x64.node
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: inputs.os == 'freebsd'
        with:
          name: native-source-${{ inputs.target }}
          path: native-source-x86_64-unknown-freebsd.tar.gz
          if-no-files-found: error
