name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'crates/**'
      - 'packages/**'
      - 'scripts/docs/**'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - '.github/workflows/deploy-docs.yaml'
      - '.github/scripts/verify-docs-export.mjs'
      - 'packages/remedia-node/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/native-deps/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The API reference is generated from the Rust crates with rustdoc JSON. Documenting them compiles
      # the FFmpeg bindings, so the same native build dependencies as CI are required.
      - name: Install native documentation build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-dev pkg-config nasm
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib/llvm-* -name libclang.so -print -quit)")" >> "$GITHUB_ENV"
      - name: Fingerprint native dependency inputs
        id: native-key
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
        run: node .github/scripts/native-cache-key.mjs
      - uses: actions/cache/restore@v5
        id: native-cache
        with:
          path: ${{ runner.temp }}/remedia-static/install
          key: ${{ steps.native-key.outputs.key }}
      - name: Build or audit cached static FFmpeg
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
        run: bash .github/scripts/build-ffmpeg-static.sh
      - uses: actions/cache/save@v5
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/remedia-static/install
          key: ${{ steps.native-key.outputs.key }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: docs-static-v2
          key: native-${{ steps.native-key.outputs.key }}
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Export documentation
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm --filter docs build
      - name: Verify exported links and resources
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node .github/scripts/verify-docs-export.mjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
