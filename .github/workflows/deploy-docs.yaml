name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'crates/**'
      - 'packages/**'
      - 'scripts/docs/**'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - '.github/workflows/deploy-docs.yaml'
      - '.github/scripts/verify-docs-export.mjs'
      - 'packages/remedia-node/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/native-deps/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The API reference is generated from the Rust crates with rustdoc JSON. Documenting them compiles
      # the FFmpeg bindings, so the same native build dependencies as CI are required.
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/native-deps/ffmpeg9.yml
          environment-name: remedia-ffmpeg9
          init-shell: bash
          cache-environment: true
          cache-environment-key: docs-ffmpeg9-${{ hashFiles('.github/native-deps/ffmpeg9.yml') }}
          cache-downloads: true
      - name: Install libclang development files
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang-dev
      - name: Configure native dependency paths
        shell: micromamba-shell {0}
        run: |
          echo "FFMPEG_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          libclang_path="$(find /usr/lib/llvm-* -name libclang.so -print -quit)"
          if [ -z "$libclang_path" ]; then echo "libclang.so not found under /usr/lib/llvm-*" >&2; exit 1; fi
          echo "LIBCLANG_PATH=$(dirname "$libclang_path")" >> "$GITHUB_ENV"
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - name: Export documentation
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm --filter docs build
      - name: Verify exported links and resources
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node .github/scripts/verify-docs-export.mjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
