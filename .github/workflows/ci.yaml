name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/**'
      - 'apps/docs/**'
      - 'apps/discord/**'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - '.cargo/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/native-deps/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '!**/*.md'
      - 'apps/docs/content/**'
      - 'LICENSE'
      - 'LICENSES.md'
      - 'SOURCE_DISTRIBUTION.md'
      - 'COPYING.GPLv3'
      - 'THIRD_PARTY_NOTICES.md'
      - 'THIRD_PARTY_LICENSES.txt'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  release-detection:
    name: Detect release and changed paths
    runs-on: ubuntu-24.04
    outputs:
      checks: ${{ steps.changes.outputs.checks }}
      native: ${{ steps.changes.outputs.native }}
      compatibility: ${{ steps.changes.outputs.compatibility }}
      sources: ${{ steps.changes.outputs.sources }}
      is_release: ${{ steps.detect.outputs.is_release }}
      version: ${{ steps.detect.outputs.version }}
      npm_tag: ${{ steps.detect.outputs.npm_tag }}
      prerelease: ${{ steps.detect.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: changes
        name: Select checks from changed paths
        run: node .github/scripts/ci-changes.mjs
      - id: detect
        name: Parse and authorize the latest main release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs detect

  draft-release:
    name: Create GitHub release draft
    if: needs.release-detection.outputs.is_release == 'true'
    needs: release-detection
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Require repository collaborator write access
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs authorize
      - name: Create or verify the immutable release tag
        env:
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          set +e
          git ls-remote --exit-code origin "refs/tags/$tag" > "$RUNNER_TEMP/tag-ref"
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            git fetch origin "refs/tags/$tag:refs/verified-tags/$tag"
            existing_commit="$(git rev-parse "refs/verified-tags/$tag^{commit}")"
            if [ "$existing_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $tag points to $existing_commit, expected release commit $GITHUB_SHA." >&2
              exit 1
            fi
          elif [ "$result" -eq 2 ]; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          else
            echo "Unable to query the remote tag $tag." >&2
            exit "$result"
          fi
      - name: Create or reuse the unpublished draft
        env:
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/github-release.mjs prepare "$RELEASE_VERSION"

  checks:
    if: needs.release-detection.outputs.checks == 'true' || needs.release-detection.outputs.is_release == 'true'
    name: Fast lint, types, and unit tests
    needs: release-detection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply the release version before package installation
        if: needs.release-detection.outputs.is_release == 'true'
        env:
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
        run: node .github/scripts/release.mjs sync "$RELEASE_VERSION"
      - run: pnpm install --frozen-lockfile
      - name: Validate POSIX installer syntax
        run: sh -n scripts/install.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @remedia/config schema:check
      - run: pnpm --filter @remedia/config test
      - name: Check formatting
        id: formatting
        run: pnpm format:check
      - name: Show expected formatting changes
        if: failure() && steps.formatting.outcome == 'failure'
        run: |
          pnpm exec oxfmt .
          git diff -- .github/scripts apps/docs/content/docs/server
      - run: pnpm --filter @remedia/plugin-host test
      - run: pnpm --filter @remedia/client test
      - run: pnpm --filter discord-app test
      - run: pnpm test:ci
      - run: pnpm test:release

  native-checks:
    if: needs.release-detection.outputs.checks == 'true' || needs.release-detection.outputs.is_release == 'true'
    name: Rust, source, and documentation validation
    needs: [release-detection, checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply the release version before package installation
        if: needs.release-detection.outputs.is_release == 'true'
        env:
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
        run: node .github/scripts/release.mjs sync "$RELEASE_VERSION"
      - run: pnpm install --frozen-lockfile
      - name: Install libclang development files for Rust checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev
      - name: Install static FFmpeg build tools
        run: sudo apt-get install --yes --no-install-recommends nasm pkg-config
      - name: Fingerprint native dependency inputs
        id: native-key
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
        run: node .github/scripts/native-cache-key.mjs
      - uses: actions/cache/restore@v5
        id: native-cache
        with:
          path: ${{ runner.temp }}/remedia-static/install
          key: ${{ steps.native-key.outputs.key }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: checks-static-v2
          key: native-${{ steps.native-key.outputs.key }}
      - name: Build or audit cached static FFmpeg for checks
        env:
          RUST_TARGET: x86_64-unknown-linux-gnu
        run: |
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib/llvm-* -name libclang.so -print -quit)")" >> "$GITHUB_ENV"
          bash .github/scripts/build-ffmpeg-static.sh
      - uses: actions/cache/save@v5
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/remedia-static/install
          key: ${{ steps.native-key.outputs.key }}
      - name: Validate a complete dependency source snapshot when its inputs change
        if: needs.release-detection.outputs.sources == 'true'
        run: |
          node .github/scripts/corresponding-source.mjs snapshot "$RUNNER_TEMP/source-validation"
          REMEDIA_SOURCE_DIR="$RUNNER_TEMP/source-validation/native" RUNNER_TEMP="$RUNNER_TEMP/offline-source-build" bash .github/scripts/build-ffmpeg-static.sh
          node .github/scripts/prepare-vendor.mjs "$RUNNER_TEMP/source-validation/vendor"
          cargo check --workspace --locked --offline --config "$RUNNER_TEMP/source-validation/vendor-config.toml" --config "source.vendored-sources.directory=\"$RUNNER_TEMP/source-validation/vendor\""
      - run: node .github/scripts/audit-linked-licenses.mjs
      - run: node .github/scripts/update-third-party-notices.mjs --check
      - run: cargo fmt --all -- --check
        if: needs.release-detection.outputs.native == 'true' || needs.release-detection.outputs.is_release == 'true'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: needs.release-detection.outputs.native == 'true' || needs.release-detection.outputs.is_release == 'true'
      - run: pnpm docs:test
      - run: pnpm --filter docs build

  supported-platforms:
    if: needs.release-detection.outputs.native == 'true' || needs.release-detection.outputs.is_release == 'true'
    name: Required native targets
    needs: [release-detection, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64 GNU
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            os: linux
            server_suffix: ''
          - label: Linux ARM64 GNU
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            server_suffix: ''
          - label: macOS x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            os: macos
            server_suffix: ''
          - label: macOS ARM64
            target: aarch64-apple-darwin
            runner: macos-15
            os: macos
            server_suffix: ''
          - label: Windows x86_64 MSVC
            target: x86_64-pc-windows-msvc
            runner: windows-2022
            os: windows
            server_suffix: .exe
          - label: Windows ARM64 MSVC
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            os: windows
            server_suffix: .exe
    uses: ./.github/workflows/platform.yaml
    with:
      label: ${{ matrix.label }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      os: ${{ matrix.os }}
      tier: supported
      server_suffix: ${{ matrix.server_suffix }}
      release_version: ${{ needs.release-detection.outputs.version }}

  additional-platforms:
    if: needs.release-detection.outputs.compatibility == 'true' || needs.release-detection.outputs.is_release == 'true'
    name: Additional native npm release targets
    needs: [release-detection, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64 musl
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            os: linux
          - label: Linux ARM64 musl
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            os: linux
          - label: Linux ARMv7 GNU
            target: armv7-unknown-linux-gnueabihf
            runner: ubuntu-24.04
            os: linux
          - label: Windows x86 MSVC
            target: i686-pc-windows-msvc
            runner: windows-2022
            os: windows
          - label: Android ARM64
            target: aarch64-linux-android
            runner: ubuntu-24.04
            os: android
          - label: Android ARMv7
            target: armv7-linux-androideabi
            runner: ubuntu-24.04
            os: android
          - label: FreeBSD x86_64
            target: x86_64-unknown-freebsd
            runner: ubuntu-24.04
            os: freebsd
    uses: ./.github/workflows/platform.yaml
    with:
      label: ${{ matrix.label }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      os: ${{ matrix.os }}
      tier: cross
      release_version: ${{ needs.release-detection.outputs.version }}

  package-release:
    if: needs.release-detection.outputs.compatibility == 'true' || needs.release-detection.outputs.is_release == 'true'
    name: Verify and pack npm release
    needs: [release-detection, checks, native-checks, supported-platforms, additional-platforms]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply the release version before package installation
        if: needs.release-detection.outputs.is_release == 'true'
        env:
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
        run: node .github/scripts/release.mjs sync "$RELEASE_VERSION"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: ${{ runner.temp }}/bindings
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: ${{ runner.temp }}/servers
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: native-source-*
          path: ${{ runner.temp }}/native-sources
          merge-multiple: true
      - name: Assemble versioned corresponding source before packaging binaries
        env:
          GH_TOKEN: ${{ github.token }}
          REMEDIA_PUBLISH_SOURCES: ${{ needs.release-detection.outputs.is_release }}
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
          REMEDIA_TARGET_SOURCES: ${{ runner.temp }}/native-sources
        run: |
          version="${RELEASE_VERSION:-$(node -p "require('./packages/remedia-node/package.json').version")}"
          node .github/scripts/corresponding-source.mjs prepare "$RUNNER_TEMP/servers" "$RUNNER_TEMP/corresponding-source" "$version"
      - name: Verify native release artifacts
        run: node .github/scripts/verify-release-artifacts.mjs "$RUNNER_TEMP/bindings" "$RUNNER_TEMP/servers"
      - name: Create and inspect N-API platform packages and pnpm tarballs
        env:
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-packages"
          version="${RELEASE_VERSION:-$(node -p "require('./packages/remedia-node/package.json').version")}"
          node .github/scripts/release.mjs pack "$version" "$RUNNER_TEMP/bindings" "$RUNNER_TEMP/servers" "$RUNNER_TEMP/npm-packages"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-release-packages
          path: ${{ runner.temp }}/npm-packages/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: release-server-binaries
          path: ${{ runner.temp }}/servers/
          if-no-files-found: error
          retention-days: 7

  upload-release:
    name: Upload and verify draft release binaries
    if: needs.release-detection.outputs.is_release == 'true'
    needs: [release-detection, draft-release, package-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Require repository collaborator write access
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs authorize
      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: ${{ runner.temp }}/release-bindings
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-server-binaries
          path: ${{ runner.temp }}/release-servers
      - name: Upload all native binaries, archives, and notices to the draft
        env:
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/github-release.mjs upload "$RELEASE_VERSION" "$RUNNER_TEMP/release-bindings" "$RUNNER_TEMP/release-servers" "$RUNNER_TEMP/github-release-assets.json"
      - uses: actions/upload-artifact@v7
        with:
          name: github-release-assets
          path: ${{ runner.temp }}/github-release-assets.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified packages via npm OIDC
    if: needs.release-detection.outputs.is_release == 'true'
    needs: [release-detection, package-release, upload-release]
    runs-on: ubuntu-24.04
    concurrency:
      group: npm-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Require repository collaborator write access
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs authorize
      - name: Install npm CLI with trusted publishing support
        run: |
          npm install --global npm@11.21.0
          test "$(npm --version)" = "11.21.0"
      - uses: actions/download-artifact@v8
        with:
          name: npm-release-packages
          path: ${{ runner.temp }}/npm-release-packages
      - name: Verify public corresponding source before npm publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/corresponding-source.mjs verify "$RUNNER_TEMP/npm-release-packages/source-manifest.json"
      - name: Publish in dependency order; skip exact versions already in npm
        env:
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
          NPM_TAG: ${{ needs.release-detection.outputs.npm_tag }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/remedia-publish.npmrc
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          node .github/scripts/release.mjs publish "$RELEASE_VERSION" "$NPM_TAG" "$RUNNER_TEMP/npm-release-packages/release-packages.json"

  github-release:
    name: Make the completed GitHub release public
    if: needs.release-detection.outputs.is_release == 'true'
    needs: [release-detection, upload-release, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Require repository collaborator write access
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs authorize
      - uses: actions/download-artifact@v8
        with:
          name: github-release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Verify every uploaded asset and publish the draft after npm succeeds
        env:
          RELEASE_VERSION: ${{ needs.release-detection.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/github-release.mjs finalize "$RELEASE_VERSION" "$RUNNER_TEMP/release-assets/github-release-assets.json"

  docker:
    name: Publish container image to GHCR
    # The Dockerfile installs the published release, so this runs only after the release is
    # public. It is a separate job: a failure here cannot undo npm or GitHub releases, and
    # "Re-run failed jobs" retries just this publication.
    if: needs.release-detection.outputs.is_release == 'true'
    needs: [release-detection, github-release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yaml
    with:
      version: ${{ needs.release-detection.outputs.version }}
