name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: cargo fmt --all -- --check
      - run: pnpm --filter @remedia/client test
      - run: pnpm --filter discord-app test
      - run: pnpm --filter docs build

  native-build:
    name: Build and Rust tests (${{ matrix.label }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64 GNU
            runner: ubuntu-24.04
            os: linux
            target: x86_64-unknown-linux-gnu
            server_suffix: ''
          - label: Linux ARM64 GNU
            runner: ubuntu-24.04-arm
            os: linux
            target: aarch64-unknown-linux-gnu
            server_suffix: ''
          - label: macOS x86_64
            runner: macos-15-intel
            os: macos
            target: x86_64-apple-darwin
            server_suffix: ''
          - label: macOS ARM64
            runner: macos-15
            os: macos
            target: aarch64-apple-darwin
            server_suffix: ''
          - label: Windows x86_64 MSVC
            runner: windows-2022
            os: windows
            target: x86_64-pc-windows-msvc
            server_suffix: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: ${{ matrix.target }}-ffmpeg7-dynamic
          key: release-no-incremental-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'packages/remedia-node/Cargo.toml', '.github/native-deps/ffmpeg7.yml', '.github/native-deps/ffmpeg7-windows.yml') }}

      - name: Install Linux build tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev

      - name: Install Linux FFmpeg 7 and Opus
        if: matrix.os == 'linux'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/native-deps/ffmpeg7.yml
          environment-name: remedia-ffmpeg7
          init-shell: bash
          cache-environment: true
          cache-environment-key: ffmpeg7-${{ matrix.target }}-${{ hashFiles('.github/native-deps/ffmpeg7.yml') }}
          cache-downloads: true

      - name: Install Windows FFmpeg 7, Opus, and libclang
        if: matrix.os == 'windows'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/native-deps/ffmpeg7-windows.yml
          environment-name: remedia-ffmpeg7
          init-shell: powershell
          cache-environment: true
          cache-environment-key: ffmpeg7-${{ matrix.target }}-${{ hashFiles('.github/native-deps/ffmpeg7-windows.yml') }}
          cache-downloads: true

      - name: Set up the MSVC environment
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install macOS FFmpeg 7 and Opus
        if: matrix.os == 'macos'
        run: brew install ffmpeg@7 opus pkg-config llvm

      - name: Configure Linux native library paths
        if: matrix.os == 'linux'
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          echo "FFMPEG_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "OPUS_LIB_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          libclang_path="$(find /usr/lib/llvm-* -name libclang.so -print -quit)"
          test -n "$libclang_path"
          echo "LIBCLANG_PATH=$(dirname "$libclang_path")" >> "$GITHUB_ENV"

      - name: Configure Windows native library paths
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ffmpegRoot = Join-Path $env:CONDA_PREFIX 'Library'
          $pkgConfigPath = Join-Path $ffmpegRoot 'lib\pkgconfig'
          $libclangPath = Join-Path $env:CONDA_PREFIX 'Library\bin'
          "FFMPEG_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          "OPUS_LIB_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$pkgConfigPath" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$libclangPath" >> $env:GITHUB_ENV
          "PATH=$(Join-Path $ffmpegRoot 'bin');$env:PATH" >> $env:GITHUB_ENV

      - name: Configure macOS native library paths
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg_prefix="$(brew --prefix ffmpeg@7)"
          opus_prefix="$(brew --prefix opus)"
          llvm_prefix="$(brew --prefix llvm)"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "OPUS_LIB_DIR=$opus_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig:$opus_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$llvm_prefix/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$ffmpeg_prefix/lib:$opus_prefix/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "$ffmpeg_prefix/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify FFmpeg 7 headers, import libraries, and dynamic library paths
        if: matrix.os == 'linux'
        shell: micromamba-shell {0}
        run: node .github/scripts/verify-native-deps.mjs

      - name: Verify FFmpeg 7 headers and dynamic library paths (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: node .github/scripts/verify-native-deps.mjs

      - name: Verify FFmpeg 7 headers, import libraries, and dynamic library paths (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: node .github/scripts/verify-native-deps.mjs

      - name: Verify the native Rust host target
        if: matrix.os != 'windows'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "Rust host: $host"
          test "$host" = "$RUST_TARGET"

      - name: Verify the native Rust host target (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          $host = (rustc -vV | Select-String '^host: ').ToString().Substring(6)
          Write-Host "Rust host: $host"
          if ($host -ne $env:RUST_TARGET) { throw "Expected $env:RUST_TARGET but found $host" }

      - name: Run Rust workspace tests in release profile
        if: matrix.os != 'windows'
        shell: bash
        run: cargo test --workspace --release --locked

      - name: Run Rust workspace tests in release profile (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: cargo test --workspace --release --locked

      - name: Run Clippy with warnings denied
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: micromamba-shell {0}
        run: cargo clippy --workspace --all-targets --release --locked -- -D warnings

      - name: Build the standalone server
        if: matrix.os != 'windows'
        shell: bash
        run: cargo build --release --locked -p remedia-server

      - name: Build the standalone server (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: cargo build --release --locked -p remedia-server

      - name: Build the N-API addon for this native target
        if: matrix.os == 'linux'
        working-directory: packages/remedia-node
        shell: micromamba-shell {0}
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --release --target "$RUST_TARGET"

      - name: Build the N-API addon for this native target (macOS)
        if: matrix.os == 'macos'
        working-directory: packages/remedia-node
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --release --target "$RUST_TARGET"

      - name: Build the N-API addon for this native target (Windows)
        if: matrix.os == 'windows'
        working-directory: packages/remedia-node
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: pnpm exec napi build --platform --esm --js native.js --dts native.d.ts --release --target $env:RUST_TARGET

      - name: Stage the standalone server binary
        if: matrix.os != 'windows'
        shell: bash
        env:
          SERVER_SUFFIX: ${{ matrix.server_suffix }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/remedia-server"
          cp "target/release/remedia-server$SERVER_SUFFIX" "$RUNNER_TEMP/remedia-server/remedia-server$SERVER_SUFFIX"

      - name: Stage the standalone server binary (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\remedia-server" | Out-Null
          Copy-Item target\release\remedia-server.exe "$env:RUNNER_TEMP\remedia-server\remedia-server.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: |
            packages/remedia-node/node.*.node
            packages/remedia-node/native.js
            packages/remedia-node/native.d.ts
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: ${{ runner.temp }}/remedia-server/remedia-server${{ matrix.server_suffix }}
          if-no-files-found: error
          retention-days: 7

  native-test:
    name: Native tests (${{ matrix.target }} / Node ${{ matrix.node }})
    needs: native-build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            os: linux
            node: '22.18.0'
            server_suffix: ''
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            os: linux
            node: '24'
            server_suffix: ''
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            os: linux
            node: '26'
            server_suffix: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            node: '22.18.0'
            server_suffix: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            node: '24'
            server_suffix: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            node: '26'
            server_suffix: ''
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            os: macos
            node: '22.18.0'
            server_suffix: ''
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            os: macos
            node: '24'
            server_suffix: ''
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            os: macos
            node: '26'
            server_suffix: ''
          - target: aarch64-apple-darwin
            runner: macos-15
            os: macos
            node: '22.18.0'
            server_suffix: ''
          - target: aarch64-apple-darwin
            runner: macos-15
            os: macos
            node: '24'
            server_suffix: ''
          - target: aarch64-apple-darwin
            runner: macos-15
            os: macos
            node: '26'
            server_suffix: ''
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            os: windows
            node: '22.18.0'
            server_suffix: .exe
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            os: windows
            node: '24'
            server_suffix: .exe
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            os: windows
            node: '26'
            server_suffix: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux FFmpeg 7 runtime libraries
        if: matrix.os == 'linux'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/native-deps/ffmpeg7.yml
          environment-name: remedia-ffmpeg7
          init-shell: bash
          cache-environment: true
          cache-environment-key: ffmpeg7-${{ matrix.target }}-${{ hashFiles('.github/native-deps/ffmpeg7.yml') }}
          cache-downloads: true

      - name: Install Windows FFmpeg 7 runtime libraries
        if: matrix.os == 'windows'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/native-deps/ffmpeg7-windows.yml
          environment-name: remedia-ffmpeg7
          init-shell: powershell
          cache-environment: true
          cache-environment-key: ffmpeg7-${{ matrix.target }}-${{ hashFiles('.github/native-deps/ffmpeg7-windows.yml') }}
          cache-downloads: true

      - name: Set up the MSVC environment
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install macOS FFmpeg 7 runtime libraries
        if: matrix.os == 'macos'
        run: brew install ffmpeg@7 opus pkg-config llvm

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
          path: packages/remedia-node

      - uses: actions/download-artifact@v8
        with:
          name: server-${{ matrix.target }}
          path: ${{ runner.temp }}/remedia-server

      - name: Configure Linux native library paths
        if: matrix.os == 'linux'
        shell: micromamba-shell {0}
        run: |
          echo "FFMPEG_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "OPUS_LIB_DIR=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure Windows native library paths
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ffmpegRoot = Join-Path $env:CONDA_PREFIX 'Library'
          "FFMPEG_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          "OPUS_LIB_DIR=$ffmpegRoot" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$(Join-Path $ffmpegRoot 'lib\pkgconfig')" >> $env:GITHUB_ENV
          "PATH=$(Join-Path $ffmpegRoot 'bin');$env:PATH" >> $env:GITHUB_ENV

      - name: Configure macOS native library paths
        if: matrix.os == 'macos'
        shell: bash
        run: |
          ffmpeg_prefix="$(brew --prefix ffmpeg@7)"
          opus_prefix="$(brew --prefix opus)"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "OPUS_LIB_DIR=$opus_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig:$opus_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$ffmpeg_prefix/lib:$opus_prefix/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Make the downloaded server executable
        if: matrix.os != 'windows'
        shell: bash
        env:
          SERVER_SUFFIX: ${{ matrix.server_suffix }}
        run: chmod +x "$RUNNER_TEMP/remedia-server/remedia-server$SERVER_SUFFIX"

      - name: Verify installed native dependencies
        if: matrix.os == 'linux'
        shell: micromamba-shell {0}
        run: node .github/scripts/verify-native-deps.mjs

      - name: Verify installed native dependencies (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: node .github/scripts/verify-native-deps.mjs

      - name: Verify installed native dependencies (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: node .github/scripts/verify-native-deps.mjs

      - name: Verify downloaded binary architectures and dynamic dependencies
        if: matrix.os == 'linux'
        shell: micromamba-shell {0}
        env:
          REMEDIA_SERVER_BINARY: ${{ runner.temp }}/remedia-server/remedia-server${{ matrix.server_suffix }}
        run: node .github/scripts/verify-native-artifacts.mjs

      - name: Verify downloaded binary architectures and dynamic dependencies (macOS)
        if: matrix.os == 'macos'
        shell: bash
        env:
          REMEDIA_SERVER_BINARY: ${{ runner.temp }}/remedia-server/remedia-server${{ matrix.server_suffix }}
        run: node .github/scripts/verify-native-artifacts.mjs

      - name: Verify downloaded binary architectures and dynamic dependencies (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          REMEDIA_SERVER_BINARY: ${{ runner.temp }}/remedia-server/remedia-server${{ matrix.server_suffix }}
        run: node .github/scripts/verify-native-artifacts.mjs

      - name: Compile TypeScript declarations without rebuilding native code
        run: pnpm --filter @remedia/node build:types

      - run: pnpm --filter @remedia/client build
      - run: pnpm --filter @remedia/node test:bindings
      - run: pnpm --filter @remedia/client test
      - run: pnpm --filter @remedia/client test:hybrid
      - name: Run remote SDK integration using the downloaded server executable
        env:
          REMEDIA_SERVER_BINARY: ${{ runner.temp }}/remedia-server/remedia-server${{ matrix.server_suffix }}
        run: pnpm --filter @remedia/client test:server
