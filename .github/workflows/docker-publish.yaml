name: Docker image

# Publishes ghcr.io/twlite/remedia for a release which is already public, because the
# Dockerfile installs the published release archives. It is called by ci.yaml after the
# `github-release` job, and can be run by hand to retry or backfill a version:
#   Actions > Docker image > Run workflow > version (for example 0.1.0-dev.6)
on:
  workflow_call:
    inputs:
      version:
        description: Published release version without the leading v
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Published release version without the leading v, for example 0.1.0-dev.6
        type: string
        required: true

permissions:
  contents: read

# One publisher at a time, so moving tags are updated in release order.
concurrency:
  group: docker-publish-${{ github.repository }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/twlite/remedia

jobs:
  plan:
    name: Plan image tags
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      moving_tag: ${{ steps.plan.outputs.moving_tag }}
      version_exists: ${{ steps.exists.outputs.version_exists }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: plan
        name: Resolve the version tag and the moving tag this release may own
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/docker-tags.mjs plan
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: exists
        name: Check whether the immutable version tag already exists
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -uo pipefail
          if output="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"; then
            echo "$IMAGE:$VERSION already exists; it is immutable and will not be rebuilt."
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown|name unknown' <<<"$output"; then
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
          else
            # Authentication or network trouble must never look like "does not exist".
            echo "$output" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.version_exists == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Each architecture builds natively and is pushed by digest only, with no tag.
      # The installer inside the Dockerfile verifies the release archive and FFmpeg 9.
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: REMEDIA_VERSION=${{ needs.plan.outputs.version }}
          secrets: |
            github_token=${{ github.token }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish tags
    needs: [plan, build]
    # Run when the build succeeded, or was skipped because the version already exists.
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build.result) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: needs.plan.outputs.version_exists == 'false'
        uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Create the multi-platform version tag
        if: needs.plan.outputs.version_exists == 'false'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # Re-check immediately before writing: a version tag is never overwritten.
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION appeared while building; keeping the existing image." >&2
          else
            references=()
            for file in "$RUNNER_TEMP"/digests/*; do
              references+=("$IMAGE@sha256:$(basename "$file")")
            done
            test "${#references[@]}" -eq 2
            docker buildx imagetools create -t "$IMAGE:$VERSION" "${references[@]}"
          fi
      - name: Point the moving tag at this version when it is the newest in its channel
        if: needs.plan.outputs.moving_tag != ''
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MOVING_TAG: ${{ needs.plan.outputs.moving_tag }}
        run: docker buildx imagetools create -t "$IMAGE:$MOVING_TAG" "$IMAGE:$VERSION"
      - name: Verify the published manifest
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$VERSION" | tee "$RUNNER_TEMP/manifest.txt"
          grep -q 'linux/amd64' "$RUNNER_TEMP/manifest.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP/manifest.txt"
