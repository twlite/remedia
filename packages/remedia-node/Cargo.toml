[package]
name = "remedia-node"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "node"
crate-type = ["cdylib"]

[dependencies]
remedia-resources = { path = "../../crates/remedia-resources" }
napi-derive = "3.6.5"
remedia-core = { path = "../../crates/remedia-core" }
remedia-discord = { path = "../../crates/remedia-discord" }
remedia-observability = { path = "../../crates/remedia-observability" }
serde_json = "1.0"
flume = "0.11"
tracing = "0.1.41"

[dependencies.napi]
version = "3.12.4"
features = ["napi3", "dyn-symbols", "tokio_rt"]
default-features = false

[build-dependencies]
napi-build = "2.4.2"

[lints]
workspace = true
