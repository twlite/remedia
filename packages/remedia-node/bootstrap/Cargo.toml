[package]
name = "remedia-node-bootstrap"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "FFmpeg-free native library loader used by @remedia/node before the engine addon loads"

[lib]
name = "bootstrap"
crate-type = ["cdylib"]

[dependencies]
napi-derive = "3.6.5"

[dependencies.napi]
version = "3.12.4"
features = ["napi3", "dyn-symbols"]
default-features = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[build-dependencies]
napi-build = "2.4.2"

[lints]
workspace = true
