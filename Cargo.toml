[workspace]
resolver = "3"
members = ["crates/*", "packages/remedia-node", "packages/remedia-node/bootstrap"]

[workspace.package]
license = "MIT"
edition = "2024"
rust-version = "1.88"

# Whole-program optimization across the engine, bindings, and statically linked codecs' Rust
# glue. Release builds link more slowly; development and test profiles are unchanged.
[profile.release]
lto = "fat"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
