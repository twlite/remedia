[workspace]
resolver = "3"
members = ["crates/*", "packages/remedia-node"]

[workspace.package]
license = "MIT"
edition = "2024"
rust-version = "1.88"

# Measured native releases retain fat LTO for size. Ordinary tests use the test profile;
# PR artifact validation uses optimized code without whole-program linking.
[profile.release]
lto = "fat"

[profile.ci]
inherits = "release"
lto = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
