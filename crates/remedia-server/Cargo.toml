[package]
name = "remedia-server"
default-run = "remedia-server"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "remedia-server-runtime"
path = "src/runtime_main.rs"

[dependencies]
remedia-resources = { path = "../remedia-resources" }
remedia-server-config = { path = "../remedia-server-config" }
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
remedia-core = { path = "../remedia-core" }
remedia-discord = { path = "../remedia-discord" }
remedia-observability = { path = "../remedia-observability" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.48", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-webpki-roots",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.41"
url = "2.5"

[lints]
workspace = true
