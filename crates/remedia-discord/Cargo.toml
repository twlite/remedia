[package]
name = "remedia-discord"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
davey = "=0.2.0"
flume = "0.11"
futures-util = "0.3"
rand = "0.9"
remedia-core = { path = "../remedia-core" }
remedia-observability = { path = "../remedia-observability" }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1.41"
tokio = { version = "1.48", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-webpki-roots",
] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"

[lints]
workspace = true

[dev-dependencies]
openmls = "0.8.1"
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
