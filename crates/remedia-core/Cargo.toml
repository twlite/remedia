[package]
name = "remedia-core"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
bench-allocation-metrics = []

[dependencies]
bytes = "1.12"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = [
  "static",
  "codec",
  "filter",
  "format",
  "software-resampling",
] }
opus2 = { version = "=0.4.0", default-features = false, features = [
  "backend-libopus",
  "bundled",
  "static",
] }
remedia-observability = { path = "../remedia-observability" }
thiserror = "2.0"
tracing = "0.1.41"
url = "2.5"

[lints]
workspace = true

[dev-dependencies]
remedia-resources = { path = "../remedia-resources" }
serde_json = "1.0"
